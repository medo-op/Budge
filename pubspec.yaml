name: budget_flow
description: Budget Flow - Personal Budget Manager PWA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  provider: 6.1.5+1
  
  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  
  # Charts
  fl_chart: ^0.69.0
  
  # Icons
  flutter_svg: ^2.0.10+1
  
  # Image picking for custom category icons
  image_picker: ^1.1.2
  
  # UUID generation
  uuid: ^4.5.1
  
  # Intl for date/number formatting
  intl: ^0.20.0
  
  # File picker
  file_picker: ^8.1.7
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
